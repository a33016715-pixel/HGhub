name: iPhone - unsigned IPA
on:
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - name: Install Apple build tools
        shell: bash
        run: |
          set -euo pipefail
          command -v xcodegen >/dev/null || brew install xcodegen
          command -v pod >/dev/null || brew install cocoapods
          xcodebuild -version
      - run: pnpm install --frozen-lockfile
      - name: Generate iOS project
        run: pnpm tauri ios init --ci --skip-targets-install
      - name: Build device app without Apple credentials
        shell: bash
        run: |
          node --input-type=module <<'HGHUB_BUILD'
          import { spawn } from "node:child_process";
          import { createWriteStream } from "node:fs";
          import { once } from "node:events";
          import {
            access, cp, mkdir, mkdtemp,
            readFile, readdir, writeFile
          } from "node:fs/promises";
          import { join } from "node:path";
          import { tmpdir } from "node:os";

          if (process.platform !== "darwin") {
            throw new Error("This script needs macOS and Xcode.");
          }

          const root = process.cwd();
          const output = join(root, "artifacts", "ios");
          const generated = join(root, "src-tauri", "gen", "apple");

          const config = JSON.parse(
            await readFile(
              join(root, "src-tauri", "tauri.conf.json"),
              "utf8"
            )
          );

          const pkg = JSON.parse(
            await readFile(join(root, "package.json"), "utf8")
          );

          if (pkg.devDependencies["@tauri-apps/cli"] !== "2.10.1") {
            throw new Error(
              "Review this workflow before changing the Tauri CLI version."
            );
          }

          await access(generated);
          await mkdir(output, { recursive: true });

          const env = {
            ...process.env,
            CI: "true",
            FORCE_COLOR: ""
          };

          const run = (command, args, options = {}) =>
            new Promise((resolveRun, reject) => {
              const child = spawn(command, args, {
                cwd: root,
                env,
                ...options
              });

              let stdout = "";
              child.stdout?.on("data", data => {
                stdout += data;
              });

              child.on("error", reject);
              child.on("exit", (code, signal) => {
                if (code === 0) {
                  resolveRun(stdout);
                } else {
                  reject(
                    new Error(
                      `${command} failed (${code ?? signal})`
                    )
                  );
                }
              });
            });

          const exists = path =>
            access(path).then(() => true, () => false);

          const addrPath = join(
            tmpdir(),
            `${config.identifier}-server-addr`
          );

          if (await exists(addrPath)) {
            throw new Error(
              "An existing Tauri session was detected."
            );
          }

          const log = createWriteStream(
            join(output, "tauri.log")
          );

          const tauri = spawn(
            "pnpm",
            ["tauri", "ios", "build", "--ci", "--open"],
            {
              cwd: root,
              env,
              detached: true,
              stdio: ["ignore", "pipe", "pipe"]
            }
          );

          let launchError;
          tauri.on("error", error => {
            launchError = error;
          });

          tauri.stdout.pipe(log, { end: false });
          tauri.stderr.pipe(log, { end: false });
          tauri.stdout.pipe(process.stdout);
          tauri.stderr.pipe(process.stderr);

          try {
            const deadline = Date.now() + 10 * 60_000;

            while (!(await exists(addrPath))) {
              if (launchError) throw launchError;

              if (tauri.exitCode !== null) {
                throw new Error(
                  "Tauri preparation failed; see tauri.log."
                );
              }

              if (Date.now() > deadline) {
                throw new Error(
                  "Tauri preparation timed out; see tauri.log."
                );
              }

              await new Promise(resolveWait =>
                setTimeout(resolveWait, 500)
              );
            }

            await access(join(root, "dist", "index.html"));

            const entries = await readdir(generated);
            const workspace = entries.find(name =>
              name.endsWith(".xcworkspace")
            );
            const project = entries.find(name =>
              name.endsWith(".xcodeproj")
            );

            if (!workspace && !project) {
              throw new Error(
                "No generated Xcode workspace/project found."
              );
            }

            const selector = workspace
              ? ["-workspace", join(generated, workspace)]
              : ["-project", join(generated, project)];

            const listing = JSON.parse(
              await run(
                "xcodebuild",
                [...selector, "-list", "-json"],
                { stdio: ["ignore", "pipe", "inherit"] }
              )
            );

            const schemes =
              (listing.workspace ?? listing.project)?.schemes ?? [];

            const candidates = schemes.filter(name =>
              name.endsWith("_iOS")
            );

            if (candidates.length !== 1) {
              throw new Error(
                `Expected one iOS scheme; found ${JSON.stringify(schemes)}`
              );
            }

            const derived = join(output, "DerivedData");

            const xcodeArgs = [
              ...selector,
              "-scheme", candidates[0],
              "-configuration", "release",
              "-sdk", "iphoneos",
              "-destination", "generic/platform=iOS",
              "-derivedDataPath", derived,
              "ARCHS=arm64",
              "CODE_SIGNING_ALLOWED=NO",
              "CODE_SIGNING_REQUIRED=NO",
              "CODE_SIGN_IDENTITY=",
              "DEVELOPMENT_TEAM=",
              "build"
            ];

            const buildLog = createWriteStream(
              join(output, "xcodebuild.log")
            );

            await once(buildLog, "open");

            try {
              await run("xcodebuild", xcodeArgs, {
                stdio: ["ignore", buildLog, buildLog]
              });
            } finally {
              buildLog.end();
            }

            const products = join(
              derived,
              "Build",
              "Products",
              "release-iphoneos"
            );

            const apps = (await readdir(products)).filter(name =>
              name.endsWith(".app")
            );

            if (apps.length !== 1) {
              throw new Error(
                `Expected one device app, found ${apps.length}`
              );
            }

            const app = join(products, apps[0]);
            const plist = join(app, "Info.plist");

            const platform = (
              await run("plutil", [
                "-extract",
                "CFBundleSupportedPlatforms.0",
                "raw",
                "-o", "-",
                plist
              ])
            ).trim();

            if (platform !== "iPhoneOS") {
              throw new Error(
                `Refusing to package a non-device app (${platform})`
              );
            }

            const executable = (
              await run("plutil", [
                "-extract",
                "CFBundleExecutable",
                "raw",
                "-o", "-",
                plist
              ])
            ).trim();

            await run("lipo", [
              "-verify_arch",
              "arm64",
              join(app, executable)
            ]);

            const stage = await mkdtemp(
              join(output, "package-")
            );

            const payload = join(stage, "Payload");
            await mkdir(payload);

            await cp(app, join(payload, apps[0]), {
              recursive: true,
              verbatimSymlinks: true
            });

            const ipa = join(
              output,
              `HGhub_${pkg.version}_arm64_unsigned.ipa`
            );

            await run("ditto", [
              "-c",
              "-k",
              "--keepParent",
              payload,
              ipa
            ]);

            const commit = (
              await run("git", ["rev-parse", "HEAD"])
            ).trim();

            await writeFile(
              join(output, "build-info.json"),
              JSON.stringify(
                {
                  commit,
                  version: pkg.version,
                  signing: "unsigned; must be signed locally before installation",
                  platform,
                  architecture: "arm64",
                  builtAt: new Date().toISOString()
                },
                null,
                2
              ) + "\n"
            );

            console.log(
              `Created ${ipa}. Sign locally before installing.`
            );
          } finally {
            if (tauri.pid) {
              try {
                process.kill(-tauri.pid, "SIGTERM");
              } catch {}
            }
            log.end();
          }
          HGHUB_BUILD
        id: build_app
      - name: Show compiler errors in summary
        if: always()
        env:
          BUILD_OUTCOME: ${{ steps.build_app.outcome }}
        shell: bash
        run: |
          node --input-type=module <<'HGHUB_DIAGNOSTICS'
          import { readFile, appendFile } from 'node:fs/promises';
          import { randomUUID } from 'node:crypto';

          const outcome = process.env.BUILD_OUTCOME || 'unknown';
          const files = ['artifacts/ios/tauri.log', 'artifacts/ios/xcodebuild.log'];
          const reports = [];
          const errorPattern = /\berror(?:\[[A-Z]\d+\])?\s*:|\bfatal error\s*:|\bError \[tauri_cli|Arch specified by Xcode was invalid/i;
          const sensitiveSetting = /(?:TOKEN|PASSWORD|SECRET|AUTHORIZATION|API_KEY)\s*[:=]/i;
          for (const path of files) {
            let content;
            try { content = await readFile(path, 'utf8'); }
            catch (error) { if (error.code === 'ENOENT') continue; throw error; }
            const lines = content.replace(/\u001b\[[0-9;]*m/g, '').split(/\r?\n/);
            const selected = new Set();
            let count = 0;
            for (let i = 0; i < lines.length && count < 6; i++) {
              if (!errorPattern.test(lines[i])) continue;
              count++;
              for (let j = i; j < Math.min(i + 9, lines.length); j++) {
                if (!sensitiveSetting.test(lines[j]) && !/^\s*export\s/.test(lines[j])) selected.add(j);
              }
            }
            const excerpt = [...selected].sort((a, b) => a - b).map(i => lines[i]).join('\n').slice(0, 9000);
            if (excerpt) reports.push({ path, excerpt });
          }

          let summary = `## iPhone build diagnostics\n\nBuild step: **${outcome}**.\n\n`;
          if (outcome === 'success') {
            summary += 'Native build and unsigned IPA packaging succeeded. The artifact still needs local signing and an iPhone test.\n';
          } else if (reports.length) {
            for (const report of reports) {
              summary += `### ${report.path}\n\n\`\`\`text\n${report.excerpt.replace(/`/g, "'")}\n\`\`\`\n\n`;
              const stopToken = randomUUID();
              console.log(`::stop-commands::${stopToken}`);
              console.log(`${report.path}:\n${report.excerpt}`);
              console.log(`::${stopToken}::`);
              if (outcome === 'failure') {
                const annotation = report.excerpt.slice(0, 3000).replace(/%/g, '%25').replace(/\r/g, '%0D').replace(/\n/g, '%0A');
                console.log(`::error title=iPhone compiler details::${annotation}`);
              }
            }
          } else {
            summary += 'No compiler error excerpt was found in the available logs. Check the failed step above and the HGhub-iPhone-build-logs artifact when available.\n';
          }
          if (process.env.GITHUB_STEP_SUMMARY) await appendFile(process.env.GITHUB_STEP_SUMMARY, summary);
          console.log(`Build diagnostic summary ready (outcome: ${outcome}).`);
          HGHUB_DIAGNOSTICS
      - name: Save IPA for local signing
        uses: actions/upload-artifact@v4
        with:
          name: HGhub-iPhone-unsigned
          path: |
            artifacts/ios/*.ipa
            artifacts/ios/build-info.json
          if-no-files-found: error
          retention-days: 7
      - name: Save build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HGhub-iPhone-build-logs
          path: artifacts/ios/*.log
          if-no-files-found: ignore
          retention-days: 7
